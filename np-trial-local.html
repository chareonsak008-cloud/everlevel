.stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, transparent 30%, rgba(10,6,20,.6) 100%); pointer-events: none; }
.hero { position: absolute; left: 50%; bottom: 120px; width: 192px; height: 192px; margin-left: -96px; image-rendering: pixelated; z-index: 2; transition: transform .2s; }
.hero.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: translateY(0) } 35% { transform: translateY(-18px) } 100% { transform: translateY(0) } }
.plate-slot { position: absolute; left: 50%; bottom: 0; top: 0; z-index: 3; }
.burst { position: absolute; left: 50%; bottom: 170px; width: 10px; height: 10px; z-index: 4; pointer-events: none; }
.burst i { position: absolute; width: 5px; height: 5px; background: var(--gold); box-shadow: 0 0 6px var(--gold); animation: fly .8s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(45deg); opacity: 0; } }
.lvup { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); z-index: 5; font: 700 26px var(--display); color: var(--gold); text-shadow: 0 2px 0 #4a2a08, 0 0 12px rgba(255,207,90,.8); opacity: 0; pointer-events: none; white-space: nowrap; }
.lvup.show { animation: lv 1.4s ease forwards; }
@keyframes lv { 0% { opacity: 0; transform: translate(-50%, 10px) } 20% { opacity: 1; transform: translate(-50%, 0) } 75% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -10px) } }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding: 14px 16px; background: var(--panel); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--edge); }
.controls label { display: grid; gap: 6px; font-size: 13px; color: var(--dim); min-width: 0; }
.controls .full { grid-column: 1 / -1; }
.lvrow { display: flex; align-items: center; gap: 12px; }
.lvnum { flex: none; min-width: 64px; text-align: center; font: 700 22px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); height: 28px; }
input[type=text] { font: 500 16px var(--body); color: var(--ink); background: var(--night); border: 1px solid var(--edge); border-radius: 4px; padding: 9px 10px; min-width: 0; }
input[type=text]:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.jobs { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 600 14px var(--body); color: var(--ink); background: #2b2240; border: 1px solid var(--edge); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--gold); color: #2a1a06; border-color: var(--gold); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .go { background: linear-gradient(#ffe48a, #d9962a); color: #2a1a06; border-color: #ffe48a; }

h2 { margin: 6px 0 0; font: 700 18px var(--display); color: var(--ink); letter-spacing: .05em; }
.tiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.tier { position: relative; display: grid; grid-template-rows: 118px auto; gap: 4px; padding: 8px 10px 10px; text-align: left; background: var(--panel); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--edge); cursor: pointer; border: 0; font: inherit; color: inherit; }
.tier[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--c, var(--gold)); }
.tier .pv { position: relative; overflow: hidden; }
.tier .pv .tag { left: 50%; }
.tier .nm { font-weight: 700; font-size: 16px; color: var(--c); }
.tier small { color: var(--dim); font-size: 13px; }
.note { margin: 0; color: var(--dim); font-size: 13px; }

.np-t2 .np-lv { color: #10141c; background: linear-gradient(#eef3fa, #8f9aac); }
.np-t3 .np-lv { color: #fff; background: linear-gradient(#8fd2ff, #2f6fd0); }
.np-t4 .np-name { color: #fff1c4; }
.np-t5 .np-lv { color: #fff; background: linear-gradient(#e8c8ff, #8a4ad8); }
.np-t5 .np-name { color: #f4e6ff; text-shadow: 0 1px 0 #000, 0 0 5px rgba(196,139,255,.9); }
.np-t6 .np-lv { color: #2a0800; background: linear-gradient(#ffd27a, #ff5a1a); }
.np-t6 .np-name { color: #ffe2c0; text-shadow: 0 1px 0 #000, 0 0 5px rgba(255,90,26,.9); }
.np-t7 .np-lv { color: #1a1030; background: linear-gradient(90deg, #ff9ad0, #ffe28a, #9af0ff, #d8b0ff, #ff9ad0); background-size: 300% 100%; animation: hue 4s linear infinite; }
.np-t7 .np-name { background: linear-gradient(90deg, #fff 0%, #ffe9a0 25%, #fff 50%, #c8f4ff 75%, #fff 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 1px 0 #000) drop-shadow(0 0 3px rgba(255,240,180,.7)); animation: txt 3s linear infinite; }
.np-star { position: absolute; width: 3px; height: 3px; background: #fff; transform: rotate(45deg); box-shadow: 0 0 4px #fff, 0 0 8px #ffe9a0; animation: tw 1.8s ease-in-out infinite; }
.big .tag { transform: translateX(-50%) scale(var(--zoom, 2)); transform-origin: 50% var(--oy, 0); }
@keyframes g5 { 0%,100% { filter: drop-shadow(0 0 2px rgba(196,139,255,.4)) } 50% { filter: drop-shadow(0 0 7px rgba(196,139,255,.95)) } }
@keyframes g6 { from { filter: drop-shadow(0 0 3px rgba(255,90,26,.5)) } to { filter: drop-shadow(0 -2px 8px rgba(255,140,40,.95)) } }
@keyframes g7 { 0%,100% { filter: drop-shadow(0 0 4px rgba(255,240,180,.6)) } 50% { filter: drop-shadow(0 0 10px rgba(255,240,180,1)) } }
@keyframes txt { to { background-position: -200% 0 } }
@keyframes hue { to { background-position: -300% 0 } }
@keyframes tw { 0%,100% { opacity: 0; transform: scale(.4) rotate(45deg) } 50% { opacity: 1; transform: scale(1.2) rotate(45deg) } }
@media (max-width: 560px) { .controls { grid-template-columns: 1fr; } .stage { height: 320px; --zoom: 1.4; } .hero { bottom: 150px; width: 160px; height: 160px; margin-left: -80px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const JOBS = [['swordsman','นักดาบ'],['archer','นักธนู'],['mage','นักเวทย์'],['acolyte','นักบวช']];
const TIERS = [
  { t: 1, min: 1, name: 'ไม้', range: 'Lv 1–19', color: '#c9a27a' },
  { t: 2, min: 20, name: 'เหล็ก', range: 'Lv 20–39', color: '#c8d0dc' },
  { t: 3, min: 40, name: 'เงินขัดเงา', range: 'Lv 40–59', color: '#a8dcff' },
  { t: 4, min: 60, name: 'ทองคำ', range: 'Lv 60–74', color: '#ffcf5a' },
  { t: 5, min: 75, name: 'อเมทิสต์', range: 'Lv 75–89', color: '#d4a8ff' },
  { t: 6, min: 90, name: 'เพลิงมังกร', range: 'Lv 90–98', color: '#ff8a4a' },
  { t: 7, min: 99, name: 'นิรันดร์', range: 'Lv 99', color: '#fff2a8' },
];
const GEO = { 1: [126, 33, 7, 6, 112, 20], 2: [140, 28, 14, 4, 112, 19], 3: [202, 29, 31, 6, 140, 16], 4: [195, 48, 41, 15, 112, 27], 5: [188, 37, 38, 9, 112, 22], 6: [168, 48, 28, 20, 112, 20], 7: [225, 108, 56, 44, 112, 22] };
const tierOf = (lv) => { let t = 1; for (const x of TIERS) if (lv >= x.min) t = x.t; return t; };
const ctx = document.createElement('canvas').getContext('2d');
const fit = (text, w, base) => { for (let s = base; s >= 8; s -= .5) { ctx.font = `600 ${s}px Kanit, sans-serif`; if (ctx.measureText(text).width <= w) return s; } return 8; };
function paint(el, name, lv) {
  const t = tierOf(lv), [W, H, ix, iy, iw, ih] = GEO[t], txt = String(lv);
  el.className = 'tag np-t' + t; el.style.width = W + 'px'; el.style.height = H + 'px';
  const fs = fit(name, iw - (6 + txt.length * 6) - 10, ih >= 20 ? 12.5 : 11.5);
  el.innerHTML = `<span class="np-in" style="left:${ix}px;top:${iy}px;width:${iw}px;height:${ih}px"><b class="np-lv">${txt}</b><span class="np-name" style="font-size:${fs}px"></span></span>` +
    (t === 7 ? '<i class="np-star" style="left:18%;top:20%"></i><i class="np-star" style="right:16%;top:34%;animation-delay:-.7s"></i><i class="np-star" style="left:48%;top:4%;animation-delay:-1.3s"></i>' : '');
  el.querySelector('.np-name').textContent = name;
  return { t, iy, ih };
}

const $ = (id) => document.getElementById(id);
let job = 'swordsman', lastTier = 0, timer = null;
const stage = document.querySelector('.stage');

function render(celebrate) {
  const lv = +$('lv').value, name = $('nm').value.trim() || 'นักผจญภัย';
  $('lvnum').textContent = 'Lv ' + lv;
  const g = paint($('plate'), name, lv);
  // วางให้ช่องข้อความ (ขยาย 2 เท่า) อยู่ใต้เท้าตัวละคร
  const footY = stage.clientHeight - (stage.clientWidth <= 560 ? 150 : 120) + 6;
  $('plate').style.top = (footY - g.iy) + 'px';
  $('plate').style.setProperty('--oy', g.iy + 'px');
  document.querySelectorAll('.tier').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.t === g.t)));
  if (celebrate && g.t !== lastTier && lastTier) {
    $('lvup').classList.remove('show'); void $('lvup').offsetWidth; $('lvup').textContent = 'ป้ายใหม่: ' + TIERS[g.t - 1].name; $('lvup').classList.add('show');
    $('hero').classList.remove('pop'); void $('hero').offsetWidth; $('hero').classList.add('pop');
    burst(TIERS[g.t - 1].color);
  }
  lastTier = g.t;
}
function burst(col) {
  const b = $('burst'); b.innerHTML = '';
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2, r = 60 + Math.random() * 50; const p = document.createElement('i'); p.style.cssText = `--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r - 30}px;background:${col};box-shadow:0 0 6px ${col}`; b.append(p); }
}

for (const [id, label] of JOBS) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(id === job));
  b.onclick = () => { job = id; $('hero').src = IMG[id]; document.querySelectorAll('#jobs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); };
  $('jobs').append(b);
}
const sample = ['ขนมหวาน', 'ลูน่า', 'มิลค์ที', 'อาร์ม', 'เงาจันทร์', 'ราชันย์เพลิง', 'เทพธิดา'];
for (const T of TIERS) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'tier'; b.dataset.t = T.t; b.style.setProperty('--c', T.color);
  b.innerHTML = `<div class="pv"><div class="tag"></div></div><span><span class="nm">${T.name}</span> <small>${T.range}</small></span>`;
  const el = b.querySelector('.tag'), g = paint(el, sample[T.t - 1], T.min === 1 ? 9 : T.min);
  el.style.top = Math.max(0, (118 - GEO[T.t][1]) / 2) + 'px';
  b.onclick = () => { stopAuto(); $('lv').value = T.min; render(true); stage.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  $('tiers').append(b);
}
function stopAuto() { if (timer) { clearInterval(timer); timer = null; $('auto').textContent = 'ไล่เลเวล 1 → 99 อัตโนมัติ'; } }
$('lv').addEventListener('input', () => { stopAuto(); render(true); });
$('nm').addEventListener('input', () => render(false));
$('up').onclick = () => { stopAuto(); $('lv').value = Math.min(99, +$('lv').value + 1); render(true); };
$('auto').onclick = () => {
  if (timer) return stopAuto();
  if (+$('lv').value >= 99) $('lv').value = 1;
  $('auto').textContent = 'หยุด';
  timer = setInterval(() => { const v = +$('lv').value + 1; $('lv').value = v; render(true); if (v >= 99) stopAuto(); }, 140);
};
addEventListener('resize', () => render(false));
document.fonts && document.fonts.ready.then(() => render(false));
render(false);
</script>
