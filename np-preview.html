<!doctype html><html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/nameplates.css">
<style>
body{margin:0;background:#120c1c;font-family:Kanit,sans-serif;color:#f6efe2}
.wrap{width:1600px;padding:24px 0 26px;background:linear-gradient(rgba(18,10,30,.45),rgba(18,10,30,.72)),url(np_bg.png) center/cover}
h1{margin:0 0 4px;text-align:center;font:700 34px 'Pixelify Sans';color:#ffd36b;letter-spacing:.06em;text-shadow:0 3px 0 #4a2a08}
p.s{margin:0 0 6px;text-align:center;color:#d8cfe6;font-size:15px}
.row{display:grid;grid-template-columns:repeat(7,1fr);align-items:end}
.cc{position:relative;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cc img{width:192px;height:192px;image-rendering:pixelated;margin-bottom:-40px}
.pl{position:relative;height:56px;width:100%}
.pl .np{left:50%;transform:translateX(-50%)}
.cap{margin-top:30px;text-align:center;font-size:14px;line-height:1.3}
.cap b{display:block;font-size:17px}.cap small{color:#bfb4cf}
</style></head><body><div class="wrap">
<h1>NAMEPLATE FRAMES</h1><p class="s">กรอบป้ายชื่อ 7 ระดับตามเลเวลตัวละคร — ยิ่งเลเวลสูงยิ่งอลังการ</p>
<div class="row" id="row"></div></div>
<script type="module">
import { paintPlate, PLATE_TIERS } from './js/ui/Nameplates.js';
const S=[['swordsman','ขนมหวาน',9],['archer','ลูน่า',27],['acolyte','มิลค์ที',48],['mage','อาร์ม',66],['archer','เงาจันทร์',82],['swordsman','ราชันย์เพลิง',94],['acolyte','เทพธิดานิรันดร์',99]];
const row=document.getElementById('row');
const rng=['Lv 1–19','Lv 20–39','Lv 40–59','Lv 60–74','Lv 75–89','Lv 90–98','Lv 99'];
S.forEach(([job,name,lv],i)=>{const T=PLATE_TIERS[i];const c=document.createElement('div');c.className='cc';
c.innerHTML=`<img src="np_${job}.png"><div class="pl"><div class="tag tag-player"></div></div><div class="cap"><b style="color:${T.color}">${T.name}</b><small>${rng[i]}</small></div>`;row.append(c);
const el=c.querySelector('.tag');const g=paintPlate(el,name,lv);el.style.top=(6-g.top)+'px';});
</script></body></html>
